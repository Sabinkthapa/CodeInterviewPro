name: Duplicate photo tool tests

on:
  push:
    branches: [main]
    paths:
      - "tools/duplicate_photos/**"
      - ".github/workflows/duplicate-photos.yml"
  pull_request:
    paths:
      - "tools/duplicate_photos/**"
      - ".github/workflows/duplicate-photos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    defaults:
      run:
        working-directory: tools/duplicate_photos
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tools/duplicate_photos/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # Linux runners have no screen, so the review-window tests run on a
      # virtual X display there. Windows and macOS runners have a desktop.
      - name: Install virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -v -W error

      - name: Run tests
        if: runner.os != 'Linux'
        run: python -m pytest -v -W error

      - name: Smoke-test the command line
        run: python dedupe_photos.py --help
